<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Creator Video Subtitle Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-sm shadow-lg">🌐</div>
                <div>
                    <h1 class="font-bold text-sm text-white">Global Creator <span class="text-indigo-400 text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/10 border border-indigo-500/20">Studio</span></h1>
                    <p class="text-[10px] text-slate-400">ID Video to EN Subtitle Translation</p>
                </div>
            </div>
            <span class="text-[10px] font-medium px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Connected
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl w-full mx-auto px-4 py-6 flex-grow space-y-4">
        
        <!-- Upload Card -->
        <div class="glass rounded-2xl p-5 space-y-4 shadow-xl">
            <label class="text-xs font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-1.5">
                📹 Unggah Video Pendek (Bahasa Indonesia):
            </label>
            
            <input type="file" id="videoFile" accept="video/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-900/90 p-3 rounded-xl border border-slate-700/80">

            <!-- URL Termux disembunyikan/ditanam otomatis agar pengguna tidak perlu isi manual -->
            <input type="hidden" id="serverUrl" value="https://a6bed81e4a56bfa7-140-213-29-232.serveousercontent.com">

            <button onclick="uploadAndTranslate()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 font-bold text-xs text-white shadow-lg shadow-indigo-600/30 hover:opacity-95 transition">
                ✨ Terjemahkan ke Teks Bahasa Inggris
            </button>
        </div>

        <!-- Progress Box -->
        <div id="progressBox" class="glass rounded-2xl p-4 hidden space-y-2 border-amber-500/30">
            <p id="statusLog" class="text-xs font-semibold text-amber-300 animate-pulse">Memproses audio video di Termux...</p>
        </div>

        <!-- Output Result -->
        <div id="resultBox" class="glass rounded-2xl p-5 hidden space-y-4 shadow-xl border-indigo-500/30">
            <h3 class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                ✅ Hasil Terjemahan Teks Sampai Selesai:
            </h3>
            
            <div class="space-y-2">
                <label class="text-[10px] text-slate-400 uppercase font-mono">Full Terjemahan Inggris:</label>
                <div id="translatedTextOutput" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs text-indigo-100 font-mono leading-relaxed select-all max-h-48 overflow-y-auto"></div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] text-slate-400 uppercase font-mono">Format Subtitle (.SRT):</label>
                <textarea id="srtOutputBox" rows="6" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-[11px] font-mono text-slate-300"></textarea>
            </div>

            <button onclick="downloadSRT()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition shadow-md">
                📥 Unduh File Subtitle .SRT
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-900 bg-slate-950 py-4 text-center text-[11px] text-slate-500">
        <p>GitHub Pages Frontend • Termux Python & FFmpeg Backend</p>
    </footer>

    <script>
        async function uploadAndTranslate() {
            const fileInput = document.getElementById('videoFile');
            const serverUrl = document.getElementById('serverUrl').value.trim();
            
            if (!fileInput.files[0]) {
                alert("Silakan pilih file video terlebih dahulu!");
                return;
            }

            const formData = new FormData();
            formData.append('video', fileInput.files[0]);

            document.getElementById('progressBox').classList.remove('hidden');
            document.getElementById('statusLog').textContent = "Mengunggah video pendek ke server Termux...";

            try {
                const response = await fetch(`${serverUrl}/translate`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('translatedTextOutput').textContent = data.translation;
                    document.getElementById('srtOutputBox').value = data.srt;
                    document.getElementById('progressBox').classList.add('hidden');
                    document.getElementById('resultBox').classList.remove('hidden');
                    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("Gagal memproses: " + data.error);
                    document.getElementById('progressBox').classList.add('hidden');
                }
            } catch (err) {
                alert("Gagal terhubung ke server Termux. Pastikan Termux dan perintah Serveo masih menyala!");
                document.getElementById('progressBox').classList.add('hidden');
            }
        }

        function downloadSRT() {
            const content = document.getElementById('srtOutputBox').value;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "creator_english_subtitles.srt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
